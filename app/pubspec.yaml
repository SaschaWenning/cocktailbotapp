name: cocktailbot_app
description: CocktailBot Raspberry Pi kiosk application
publish_to: "none"
version: 2.8.1+29

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  http: ^1.6.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/drink_previews/
    - assets/drink_previews/cocktailbot/
    - assets/drinks/
    - assets/drinks/cocktailbot/
