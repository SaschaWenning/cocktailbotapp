name: Build Flutter Web

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        working-directory: app
        run: |
          flutter config --enable-web
          flutter pub get
          flutter create . --platforms web
          flutter build web --release --no-web-resources-cdn

      - name: Verify offline Flutter runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking build for external Flutter renderer CDN dependencies..."
          if grep -RIEq \
            'https://www\.gstatic\.com/flutter-canvaskit|https://storage\.googleapis\.com/flutter_infra_release/flutter_web_canvaskit' \
            app/build/web; then
            echo "ERROR: Flutter build still contains an external CanvasKit CDN dependency." >&2
            exit 1
          fi
          echo "Offline Flutter runtime check OK."
      - name: Publish web-release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/build/web
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Flutter web release ${GITHUB_SHA}"
          git branch -M web-release
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-release
